# Dependabot - weekly npm dependency updates
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    versioning-strategy: "auto"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          - "eslint*"
          - "prettier"
          - "typescript"
          - "jest*"
          - "@jest/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"