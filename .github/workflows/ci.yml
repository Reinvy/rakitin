name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm run test:ci

    - name: Tree must stay clean after the suite
      run: git diff --exit-code

    - name: Upload coverage to Codecov
      if: matrix.node-version == '22.x'
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Real gate: lint failures must turn the job red.
    - name: Run linting (ESLint flat config)
      run: npm run lint

  typecheck:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type-check declaration surface
      run: npm run typecheck

  smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Guard the headless contract end-to-end without network installs.
    - name: Smoke CLI commands in a throwaway project
      shell: bash
      run: |
        SMOKE_DIR="$(mktemp -d)"
        cd "$SMOKE_DIR"
        echo '{"name":"smoke-demo","version":"1.0.0"}' > package.json
        RAK="$GITHUB_WORKSPACE/bin/rakitin.js"

        # --json stdout must be parseable in isolation.
        node "$RAK" list --json | jq -e . >/dev/null
        node "$RAK" info --json | jq -e '.ok == true' >/dev/null
        node "$RAK" doctor --json | jq -e '.ok == true' >/dev/null
        node "$RAK" --cli-version

        # Dry-run must plan without touching disk.
        BEFORE="$(find . -type f | sort | md5sum)"
        node "$RAK" add module smoke-mod --arch modular --orm none --yes --no-install --dry-run --json \
          | jq -e 'all(.plan[]; .op == "create" or .op == "overwrite" or .op == "mkdir" or .op == "install")' >/dev/null
        node "$RAK" add middleware auth --dry-run --json | jq -e '.ok == true' >/dev/null
        node "$RAK" recipe auth --dry-run --json | jq -e '.ok == true' >/dev/null
        node "$RAK" init --orm prisma --dry-run --json | jq -e '.ok == true' >/dev/null
        AFTER="$(find . -type f | sort | md5sum)"
        test "$BEFORE" = "$AFTER" || { echo "dry-run leaked to disk"; exit 1; }
        test ! -d node_modules || { echo "dry-run installed packages"; exit 1; }

        # Real generation + wiring + boot smoke.
        node "$RAK" add module smoke-mod --arch modular --orm none --yes --no-install --json \
          | jq -e '(.ok == true) and (.created | length > 0)' >/dev/null
        node "$RAK" integrate --json >/dev/null
        node --check app/routes/index.js
        node --check app/modules/smoke-mod/routes/smoke-mod.router.js
        node "$RAK" doctor --json | jq -e '.ok == true' >/dev/null
