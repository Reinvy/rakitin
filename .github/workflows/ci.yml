name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm run test:ci

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20.x'
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Real gate: lint failures must turn the job red.
    - name: Run linting (ESLint flat config)
      run: npm run lint

  typecheck:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type-check declaration surface
      run: npm run typecheck

  smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Guard the headless contract end-to-end without network installs.
    - name: Smoke CLI commands in a throwaway project
      shell: bash
      run: |
        SMOKE_DIR="$(mktemp -d)"
        cd "$SMOKE_DIR"
        echo '{"name":"smoke-demo"}' > package.json

        node "$GITHUB_WORKSPACE/bin/rakitin.js" list --json | grep '"command"'
        node "$GITHUB_WORKSPACE/bin/rakitin.js" info --json | grep 'packageManager'
        node "$GITHUB_WORKSPACE/bin/rakitin.js" add module smoke-mod --arch modular --orm none --yes --dry-run --json | grep '"plan"'
        test ! -d app/modules/smoke-mod || { echo "dry-run leaked to disk"; exit 1; }
        node "$GITHUB_WORKSPACE/bin/rakitin.js" add module smoke-mod --arch modular --orm none --yes --json >/dev/null
        node "$GITHUB_WORKSPACE/bin/rakitin.js" integrate --json >/dev/null
        # Generated router must at least PARSE as JS (no deps needed for --check)
        node --check app/routes/index.js
        node --check app/modules/smoke-mod/routes/smoke-mod.router.js
        node "$GITHUB_WORKSPACE/bin/rakitin.js" doctor

  build:
    runs-on: ubuntu-latest
    needs: [test, lint, typecheck]
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Real gate for the publish pipeline.
    - name: Build dual output (esbuild)
      run: npm run build
